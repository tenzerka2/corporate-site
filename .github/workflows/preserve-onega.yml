name: Preserve Onega archive

on:
  push:
    branches: [main]
    paths: [.github/workflows/preserve-onega.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onega-archive-2026-10-05
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify preserved snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive_name=onega-archive-2026-10-05.tar.gz
          # The original transfer server is temporary. Subsequent runs use the release.
          if gh release view onega-archive-2026-10-05 >/dev/null 2>&1; then
            gh release download onega-archive-2026-10-05 --pattern "$archive_name"
          else
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
              "http://178.236.247.118:3107/$archive_name" --output "$archive_name"
          fi
          printf '%s  %s\n' c8ea628f78c896678600e883c5a786136c24084a319937a8bf7e630ccedc8193 "$archive_name" > "$archive_name.sha256"
          sha256sum -c "$archive_name.sha256"
          tar -xzf "$archive_name"
          cd onega-archive-2026-10-05
          sha256sum -c MANIFEST.sha256
          git clone --quiet history.bundle restored-history
          git -C restored-history fsck --full
          test "$(git -C restored-history rev-parse HEAD)" = cf6f8dd7e9beef569e85848ce71231b940da4442
      - name: Publish full archive as a release asset
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Архив незавершённого проекта «Онега Логистик» от 05.10.2026.

          Полный пакет содержит код, Git-историю, первоначальные пять промптов, сохранённые промпты изображений, отклонённую графику, Blender-сцены, скриншоты и отчёты. Точка остановки описана в project/archive/STATUS.md. Визуальная часть не принята; калькулятор и полноценные внутренние страницы не реализованы.

          Скачайте файл onega-archive-2026-10-05.tar.gz из Assets. Автоматические Source code ZIP/TAR содержат только файлы Git и не заменяют полный пакет со скриншотами и Blender-исходниками.

          Исходный коммит снимка: cf6f8dd7e9beef569e85848ce71231b940da4442.
          SHA-256: c8ea628f78c896678600e883c5a786136c24084a319937a8bf7e630ccedc8193.
          NOTES
          if gh release view onega-archive-2026-10-05 >/dev/null 2>&1; then
            echo 'The existing verified archive is preserved.'
          else
            gh release create onega-archive-2026-10-05 \
              onega-archive-2026-10-05.tar.gz \
              onega-archive-2026-10-05.tar.gz.sha256 \
              --target cf6f8dd7e9beef569e85848ce71231b940da4442 \
              --title 'Онега: полный архив на 05.10.2026' \
              --notes-file release-notes.md
          fi
