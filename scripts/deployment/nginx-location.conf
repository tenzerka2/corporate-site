# Include inside the existing shvetsov.studio HTTPS server.
# Keep the prefix: the application is built with basePath=/work/onega.
location = /work/onega {
    proxy_pass http://127.0.0.1:3107;
    include /etc/nginx/snippets/onega-proxy.conf;
}
location ^~ /work/onega/ {
    proxy_pass http://127.0.0.1:3107;
    include /etc/nginx/snippets/onega-proxy.conf;
}
